[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numeric-flow"
version = "0.1.0"
description = "A restored numerical optimal-control experiment in Python and C++"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
numeric-flow = "pysource.__main__:main"

[tool.setuptools]
packages = ["pysource"]
